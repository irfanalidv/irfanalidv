      <stop offset="0" stop-color="#0B132B"/>
      <stop offset="1" stop-color="#13203F"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="-10%" r="55%">
      <stop offset="0" stop-color="#00D1D1" stop-opacity="0.28"/>
