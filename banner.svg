  <text x="72" y="168" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" font-weight="700">I make LLM systems reliable in production</text>
  <text x="72" y="210" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18">retrieval · agents · voice · and the evals that prove they work</text>
  <rect x="72" y="240" width="220" height="3" rx="1.5" fill="#00D1D1"/>
